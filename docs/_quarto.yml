project:
  type: website
  pre-render:
    - ../scripts/generate_docs.py omop
    # Writes omop_data_dictionary.qmd and downloads/*.xlsx. Must precede
    # generate_llms_txt.py, which reads the dictionary page.
    - ../scripts/generate_exports.py omop
    - ../scripts/generate_faq.py
    # Validates fixed release records and entries, then writes both release
    # pages. No live PR lookups. Must precede generate_llms_txt.py.
    - ../scripts/generate_release_notes.py
    - ../scripts/generate_llms_txt.py
  render:
    - starr_omop54.qmd
    - omop_data_model.qmd
    - faq.qmd
    - about.qmd
    - 404.qmd
    - changes_53_to_54.qmd
    - released_datasets.qmd
    - release_notes.qmd
    - getting_access.qmd
    - omop_data_dictionary.qmd
  resources:
    - llms.txt
    - llms-full.txt
    - downloads/
    - assets/

