[project]
name = "starr-docs-omop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.36.0",
    "ipykernel>=6.29.5",
    "lxml>=6.0.1",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pandas>=2.2.3",
    "pre-commit>=4.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "db-dtypes>=1.7.1",
    # Pinned exactly, not floored: docs/downloads/starr_omop_data_dictionary.xlsx
    # is committed, and the generator only stays byte-reproducible if every
    # contributor writes it with the same serializer. Measured — 3.2.0 and 3.2.9
    # produce different bytes from identical data, while pandas 2.2.3 vs 3.0.3
    # produce the same bytes, so xlsxwriter alone decides the binary. Bump this
    # pin and the regenerated workbook in the same commit.
    "xlsxwriter==3.2.9"
]
